<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Manrope:wght@400;600;700;800&display=swap');

    --felt-dark:#04241a;
    --felt:#0b3d2e;
    --felt-light:#12523e;
    --gold:#d9b45a;
    --gold-bright:#f0d68a;

    --red-bright:#b83247;

    background:
      radial-gradient(ellipse at top, rgba(255,255,255,0.05), transparent 60%),

    text-shadow:0 2px 6px rgba(0,0,0,0.5);

  .card{
    background:linear-gradient(160deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));

  input[type=text], input[type=number]{

  select{
    width:100%; padding:13px 14px; font-size:0.95rem; border-radius:12px;
    border:1px solid rgba(217,180,90,0.35); background:rgba(0,0,0,0.25); color:var(--cream);
    font-family:'Manrope',sans-serif;

  .err{color:var(--red-bright); font-size:0.8rem; margin-top:8px; text-align:center;}
  .toast{
    position:fixed; top:16px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.85); color:var(--gold-bright); padding:10px 18px;
    border-radius:20px; font-size:0.85rem; font-weight:700; z-index:50;

    opacity:0; transition:opacity 0.25s ease;

  .toast.show{opacity:1;}

<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

<script>
const HAND_RANKINGS = [
  ["Royal Flush","A, K, Q, J, 10, all the same suit."],
  ["Straight Flush","Five cards in a row, all the same suit."],
  ["Four of a Kind","Four cards of the same rank."],
  ["Full House","Three of a kind plus a pair."],
  ["Flush","Five cards of the same suit, any order."],
  ["Straight","Five cards in a row, mixed suits."],
  ["Three of a Kind","Three cards of the same rank."],
  ["Two Pair","Two separate pairs."],
  ["Pair","Two cards of the same rank."],
  ["High Card","No combination — highest card plays."]
];

// Loans are poker-coins only. Adjust these two numbers to change house rules.
const LOAN_INTEREST_RATE = 0.2;     // 20% — borrow 100, owe 120 back
const LOAN_REPAYMENT_SHARE = 0.5;   // 50% of each pot you win goes to open loans until paid off

// ============================================================
// FIREBASE SETUP — paste your own project's config here.
// Get this from: Firebase Console > Project Settings > Your apps > (</>) web app
// See the setup steps that came with this file.
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyCLdMLLgzV8BgdwudpjOApuquiVkNrA5a0",
  authDomain: "chip-room-f2462.firebaseapp.com",
  databaseURL: "https://chip-room-f2462-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "chip-room-f2462",
  storageBucket: "chip-room-f2462.firebasestorage.app",
  messagingSenderId: "785904312325",
  appId: "1:785904312325:web:2088cfa0315a811699fc6c",
  measurementId: "G-RKP9B9F6DH"
};
// ============================================================

let db = null;
let firebaseReady = false;
try {
  if (!firebaseConfig.apiKey.includes('PASTE_YOUR')) {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    firebaseReady = true;
  }
} catch (e) {
  console.error('Firebase init failed:', e);
}

let state = {
  screen: 'home',      // home | join | table
  code: null,
  mySeat: null,         // index of seat I'm sitting in
  myName: '',
  table: null,          // cached table object
  tab: 'poker',          // poker | blackjack | ranks
  poll: null,
  error: ''
};

function genCode(){
  const letters = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  let c = '';
  for(let i=0;i<4;i++) c += letters[Math.floor(Math.random()*letters.length)];
  return c;
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=> t.classList.remove('show'), 1600);
}

async function saveTable(table){
  table.updatedAt = Date.now();
  try{
    await db.ref('chiproom/'+table.code).set(table);
    state.table = table;
  }catch(e){ console.error(e); toast('Sync error — check your Firebase setup'); }
}

async function loadTable(code){
  try{
    const snap = await db.ref('chiproom/'+code).once('value');
    return snap.exists() ? snap.val() : null;
  }catch(e){
    console.error(e);
    return null;
  }
}

// Live listener — Firebase pushes updates instantly instead of polling.
function startPolling(){
  stopPolling();
  if(!state.code) return;
  state.pollRef = db.ref('chiproom/'+state.code);
  state.pollHandler = (snap)=>{
    if(snap.exists()){
      state.table = snap.val();
      if(state.mySeat !== null){
        const mine = state.table.players[state.mySeat];
        if(!mine || mine.empty){
          state.mySeat = null;
          toast("You were removed from your seat");
        }
      }
      render(true);
    }
  };
  state.pollRef.on('value', state.pollHandler);
}
function stopPolling(){
  if(state.pollRef && state.pollHandler){
    state.pollRef.off('value', state.pollHandler);
  }
  state.pollRef = null;
  state.pollHandler = null;
}

async function createTable(seats, startPoker, startBlackjack, hostName){
  const code = genCode();
  const table = {
    code,
    seatCount: seats,
    startingPoker: startPoker,
    startingBlackjack: startBlackjack,
    dealerSeat: null,
    loans: [],
    balanceHistory: [],
    players: Array.from({length:seats}, ()=> ({empty:true})),
    pokerPot: 0,
    createdAt: Date.now()
  };
  table.players[0] = {
    empty: false,
    name: hostName.trim(),
    isHost: true,
    poker: startPoker,
    blackjack: startBlackjack,
    pokerBet: 0,
    lastPokerBet: 0,
    blackjackBet: 0
  };
  snapshotBalances(table);
  await saveTable(table);
  state.code = code;
  state.mySeat = 0;
  render();
}

function isHost(){
  const t = state.table;
  return !!(t && state.mySeat !== null && t.players[state.mySeat] && t.players[state.mySeat].isHost);
}

function isDealer(){
  const t = state.table;
  return !!(t && state.mySeat !== null && t.dealerSeat === state.mySeat);
}

async function joinByCode(code){
  code = code.trim().toUpperCase();
  if(!code){ state.error='Enter a room code.'; render(); return; }
  const t = await loadTable(code);
  if(!t){ state.error='No table found with that code.'; render(); return; }
  state.code = code;
  state.table = t;
  state.error = '';
  state.screen = 'table';
  startPolling();
  render();
}

async function claimSeat(idx, name){
  name = name.trim();
  if(!name){ toast('Enter a name first'); return; }

  const existing = state.table && state.table.players ? state.table.players[idx] : null;
  if(existing && !existing.empty && existing.name.toLowerCase() === name.toLowerCase()){
    // reclaiming your own seat after a refresh
    state.mySeat = idx;
    render();
    return;
  }

  const tx = await transactTable(t=>{
    const current = t.players[idx];
    if(current && !current.empty){
      if(current.name.toLowerCase() === name.toLowerCase()) return;
      return 'Seat taken by someone else';
    }
    t.players[idx] = {
      empty: false,
      name,
      isHost: false,
      poker: t.startingPoker,
      blackjack: t.startingBlackjack,
      pokerBet: 0,
      lastPokerBet: 0,
      blackjackBet: 0
    };
  });

  if(tx.error){ toast(tx.error); return; }
  if(!tx.committed) return;
  state.mySeat = idx;
  render();
}

async function setDealer(idx){
  if(!isHost()){ toast('Only the host can set the dealer'); return; }
  const tx = await transactTable(t=>{
    if(!t.players[idx] || t.players[idx].empty) return 'Pick a valid player';
    t.dealerSeat = idx;
  });
  if(tx.error){ toast(tx.error); return; }
  if(!tx.committed) return;
  render();
  toast(state.table.players[idx].name + ' is now the dealer');
}

function leaveSeat(){
  state.mySeat = null;
  render();
}

async function refreshLatest(){
  const t = await loadTable(state.code);
  if(t){ state.table = t; }
  return state.table;
}

async function transactTable(mutator){
  let actionError = '';
  try{
    const result = await db.ref('chiproom/'+state.code).transaction(t=>{
      actionError = '';
      if(!t){
        actionError = 'Table no longer exists';
        return;
      }
      const err = mutator(t);
      if(typeof err === 'string' && err){
        actionError = err;
        return;
      }
      t.updatedAt = Date.now();
      return t;
    });
    if(result.committed && result.snapshot.exists()){
      state.table = result.snapshot.val();
    }
    return { committed: result.committed, error: actionError };
  }catch(e){
    console.error(e);
    toast('Sync error — check your Firebase setup');
    return { committed: false, error: '' };
  }
}

async function placePokerBet(idx, amount){
  amount = Math.floor(Number(amount));
  if(!amount || amount<=0){ toast('Enter a valid amount'); return; }

  const tx = await transactTable(t=>{
    const p = t.players[idx];
    if(!p || p.empty) return 'Player not found';
    if(amount > p.poker) return 'Not enough coins';
    p.poker -= amount;
    p.pokerBet += amount;
    p.lastPokerBet = amount;
    t.pokerPot += amount;
  });

  if(tx.error){ toast(tx.error); return; }
  if(!tx.committed) return;
  render();
}

async function callPokerBet(idx){
  const tx = await transactTable(t=>{
    const p = t.players[idx];
    if(!p || p.empty) return 'Player not found';
    const highest = Math.max(0, ...t.players.filter(pl=> pl && !pl.empty).map(pl=> pl.pokerBet));
    const needed = highest - p.pokerBet;
    if(needed <= 0) return 'You already match the highest bet';
    if(needed > p.poker) return 'Not enough coins to call — bet manually for what you have';
    p.poker -= needed;
    p.pokerBet += needed;
    p.lastPokerBet = needed;
    t.pokerPot += needed;
  });

  if(tx.error){ toast(tx.error); return; }
  if(!tx.committed) return;
  render();
}

// Records a point-in-time snapshot of every seated player's poker balance,
// used to draw the balance-over-time graph in the Loans tab.
function snapshotBalances(t){
  t.balanceHistory = t.balanceHistory || [];
  t.balanceHistory.push({
    timestamp: Date.now(),
    balances: t.players.map(p => (p && !p.empty) ? p.poker : null)
  });
  if(t.balanceHistory.length > 200) t.balanceHistory = t.balanceHistory.slice(-200);
}

// Credits winnings to a player, automatically skimming a share toward any
// open loans they owe (oldest loan first) before the rest lands in their balance.
function applyPokerWinnings(t, seatIdx, amount){
  let toPlayer = amount;
  let repaidTotal = 0;
  const openLoans = (t.loans || [])
    .filter(l => l.active && l.borrower === seatIdx)
    .sort((a,b) => a.timestamp - b.timestamp);

  if(openLoans.length){
    let repayPool = Math.floor(amount * LOAN_REPAYMENT_SHARE);
    for(const loan of openLoans){
      if(repayPool <= 0 || toPlayer <= 0) break;
      const owed = loan.totalOwed - loan.repaid;
      const pay = Math.min(repayPool, owed, toPlayer);
      if(pay <= 0) continue;
      loan.repaid += pay;
      repayPool -= pay;
      toPlayer -= pay;
      repaidTotal += pay;
      const lender = t.players[loan.lender];
      if(lender && !lender.empty) lender.poker += pay;
      if(loan.repaid >= loan.totalOwed) loan.active = false;
    }
  }

  t.players[seatIdx].poker += toPlayer;
  return repaidTotal;
}

async function giveLoan(borrowerIdx, amount){
  if(state.mySeat === null){ toast('Take a seat first'); return; }
  amount = Math.floor(Number(amount));
  if(borrowerIdx === state.mySeat){ toast("You can't loan to yourself"); return; }
  if(!amount || amount <= 0){ toast('Enter a valid amount'); return; }

  const loanId = 'loan_' + Date.now() + '_' + Math.floor(Math.random()*1000);
  const loanTimestamp = Date.now();

  const tx = await transactTable(t=>{
    const lender = t.players[state.mySeat];
    const borrower = t.players[borrowerIdx];
    if(!borrower || borrower.empty) return 'Pick a valid player';
    if(!lender || lender.empty) return 'Take a seat first';
    if(amount > lender.poker) return 'Not enough coins to loan that much';

    lender.poker -= amount;
    borrower.poker += amount;
    t.loans = t.loans || [];
    t.loans.push({
      id: loanId,
      lender: state.mySeat,
      borrower: borrowerIdx,
      principal: amount,
      totalOwed: Math.round(amount * (1 + LOAN_INTEREST_RATE)),
      repaid: 0,
      active: true,
      timestamp: loanTimestamp
    });
    snapshotBalances(t);
  });

  if(tx.error){ toast(tx.error); return; }
  if(!tx.committed) return;
  render();
  toast(state.table.players[state.mySeat].name + ' loaned ' + amount + ' to ' + state.table.players[borrowerIdx].name);
}

async function awardPot(winnerIdx){
  if(!isHost()){ toast('Only the host can award the pot'); return; }
  let repaid = 0;

  const tx = await transactTable(t=>{
    if(t.pokerPot <= 0) return 'Pot is empty';
    if(!t.players[winnerIdx] || t.players[winnerIdx].empty) return 'Pick a valid winner';
    const pot = t.pokerPot;
    repaid = applyPokerWinnings(t, winnerIdx, pot);
    t.pokerPot = 0;
    t.players.forEach(p=>{ if(p && !p.empty){ p.pokerBet = 0; p.lastPokerBet = 0; } });
    snapshotBalances(t);
  });

  if(tx.error){ toast(tx.error); return; }
  if(!tx.committed) return;
  render();
  toast(state.table.players[winnerIdx].name + ' wins the pot!' + (repaid>0 ? ' ('+repaid+' went to a loan)' : ''));
}

async function returnPokerBets(){
  if(!isHost()){ toast('Only the host can do that'); return; }

  const tx = await transactTable(t=>{
    t.players.forEach(p=>{
      if(p && !p.empty){ p.poker += p.pokerBet; p.pokerBet = 0; p.lastPokerBet = 0; }
    });
    t.pokerPot = 0;
  });

  if(tx.error){ toast(tx.error); return; }
  if(!tx.committed) return;
  render();
  toast('Bets returned');
}

async function placeBjBet(idx, amount){
  if(idx !== state.mySeat){ toast('You can only bet for yourself'); return; }
  amount = Math.floor(Number(amount));
  if(!amount || amount<=0){ toast('Enter a valid amount'); return; }

  const tx = await transactTable(t=>{
    if(t.dealerSeat === idx) return 'The dealer doesn\'t place bets';
    const p = t.players[idx];
    if(!p || p.empty) return 'Player not found';
    if(p.blackjackBet > 0) return 'Resolve current bet first';
    if(amount > p.blackjack) return 'Not enough coins';
    p.blackjack -= amount;
    p.blackjackBet = amount;
  });

  if(tx.error){ toast(tx.error); return; }
  if(!tx.committed) return;
  render();
}

async function resolveBj(idx, outcome){
  if(!isDealer()){ toast('Only the dealer can resolve hands'); return; }

  const tx = await transactTable(t=>{
    const p = t.players[idx];
    if(!p || p.empty) return 'Player not found';
    if(p.blackjackBet <= 0) return 'No active bet';
    if(outcome === 'win') p.blackjack += p.blackjackBet * 2;
    // lose: bet stays gone, nothing added back
    p.blackjackBet = 0;
  });

  if(tx.error){ toast(tx.error); return; }
  if(!tx.committed) return;
  render();
}

async function resetPokerBalances(){
  if(!isHost()){ toast('Only the host can reset poker balances'); return; }
  if(!confirm('Reset everyone\'s poker coins back to the starting amount? This also clears all loan debt.')) return;

  const tx = await transactTable(t=>{
    t.players.forEach(p=>{
      if(p && !p.empty){
        p.poker = t.startingPoker;
        p.pokerBet = 0;
        p.lastPokerBet = 0;
      }
    });
    t.pokerPot = 0;
    (t.loans || []).forEach(l => { l.active = false; });
    snapshotBalances(t);
  });

  if(tx.error){ toast(tx.error); return; }
  if(!tx.committed) return;
  render();
  toast('Poker balances reset');
}

async function resetBlackjackBalances(){
  if(!isHost()){ toast('Only the host can reset blackjack balances'); return; }
  if(!confirm('Reset everyone\'s blackjack coins back to the starting amount?')) return;

  const tx = await transactTable(t=>{
    t.players.forEach(p=>{
      if(p && !p.empty){
        p.blackjack = t.startingBlackjack;
        p.blackjackBet = 0;
      }
    });
  });

  if(tx.error){ toast(tx.error); return; }
  if(!tx.committed) return;
  render();
  toast('Blackjack balances reset');
}

async function kickPlayer(idx){
  if(!isHost()){ toast('Only the host can kick players'); return; }
  if(idx === state.mySeat){ toast("You can't kick yourself"); return; }
  const current = state.table && state.table.players ? state.table.players[idx] : null;
  if(!current || current.empty) return;
  if(!confirm('Kick ' + current.name + ' from the table?')) return;

  let removedName = current.name;
  const tx = await transactTable(t=>{
    const p = t.players[idx];
    if(!p || p.empty) return 'Player is no longer seated';
    removedName = p.name;
    t.players[idx] = {empty: true};
    if(t.dealerSeat === idx) t.dealerSeat = null;
    (t.loans || []).forEach(l=>{
      if(l.lender === idx || l.borrower === idx) l.active = false;
    });
  });

  if(tx.error){ toast(tx.error); return; }
  if(!tx.committed) return;
  render();
  toast(removedName + ' was removed');
}

function goHome(){
  stopPolling();
  state = {screen:'home', code:null, mySeat:null, myName:'', table:null, tab:'poker', poll:null, error:''};
  render();
}

async function cleanupOldRooms(){
  const cutoff = Date.now() - (24 * 60 * 60 * 1000);
  try{
    const snap = await db.ref('chiproom').once('value');
    if(!snap.exists()){ toast('No old rooms to clean'); return; }

    const rooms = snap.val();
    const oldCodes = Object.keys(rooms).filter(code=>{
      const room = rooms[code];
      const lastActivity = room && (room.updatedAt || room.createdAt || 0);
      return lastActivity < cutoff;
    });

    if(!oldCodes.length){ toast('No old rooms to clean'); return; }

    if(!confirm('Delete ' + oldCodes.length + ' room' + (oldCodes.length===1?'':'s') + ' inactive for more than 24 hours?')) return;

    let deleted = 0;
    for(const code of oldCodes){
      const result = await db.ref('chiproom/'+code).transaction(room=>{
        if(!room) return;
        const lastActivity = room.updatedAt || room.createdAt || 0;
        if(lastActivity >= cutoff) return;
        return null;
      });
      if(result.committed && !result.snapshot.exists()) deleted++;
    }

    toast(deleted ? (deleted + ' old room' + (deleted===1?'':'s') + ' deleted') : 'No old rooms to clean');
  }catch(e){
    console.error(e);
    toast('Room cleanup failed');
  }
}

function render(preserveFocus){
  const app = document.getElementById('app');

  let savedId = null, savedValue = null, savedSelStart = null, savedSelEnd = null;
  if(preserveFocus){
    const active = document.activeElement;
    if(active && app.contains(active) && active.id && (active.tagName === 'INPUT')){
      savedId = active.id;
      savedValue = active.value;
      savedSelStart = active.selectionStart;
      savedSelEnd = active.selectionEnd;
    }
  }

  if(!firebaseReady){ app.innerHTML = renderSetupNeeded(); return; }
  if(state.screen === 'home') app.innerHTML = renderHome();
  else if(state.screen === 'join') app.innerHTML = renderJoin();
  else if(state.screen === 'table') app.innerHTML = renderTable();
  attachHandlers();

  if(savedId){
    const el = document.getElementById(savedId);
    if(el){
      el.value = savedValue;
      el.focus();
      if(typeof savedSelStart === 'number'){
        try{ el.setSelectionRange(savedSelStart, savedSelEnd); }catch(e){}
      }
    }
  }
}

function renderBlackjack(t){
  const seatedPlayers = t.players.map((p,i)=> (p && !p.empty) ? {p,i} : null).filter(Boolean);
  const dealerAssigned = t.dealerSeat !== null && t.dealerSeat !== undefined && t.players[t.dealerSeat] && !t.players[t.dealerSeat].empty;

  let dealerCard = '';
  if(!dealerAssigned){
    if(isHost()){
      const opts = seatedPlayers.map(({p,i})=> `<option value="${i}">${p.name}</option>`).join('');
      dealerCard = `
        <div class="card">
          <h2 style="margin-top:0;font-size:1rem;color:var(--gold-bright);">Assign a dealer</h2>
          <p class="muted">The dealer runs blackjack for everyone else and doesn't play their own hand in this tab.</p>
          <div class="row">
            <select id="dealerSelect">${opts}</select>
            <button class="btn-gold" id="setDealerBtn" style="flex:0 0 auto;">Set Dealer</button>
          </div>
        </div>
      `;
    } else {
      dealerCard = `<div class="card center muted">Waiting for the host to assign a dealer.</div>`;
    }
  } else {
    const dealerName = t.players[t.dealerSeat].name;
    dealerCard = `
      <div class="card center">
        <span class="muted">Dealer: </span><span class="seat-name" style="color:var(--gold-bright);">${dealerName}</span>
        ${isHost() ? `<button class="btn-ghost btn-small" id="changeDealerBtn" style="margin-left:10px;">Change</button>` : ''}
      </div>
    `;
  }

  if(!dealerAssigned){
    return dealerCard;
  }

  let body = '';
  if(isDealer()){
    // Dealer view: resolve each other player's bet
    const rows = seatedPlayers.filter(({i})=> i !== t.dealerSeat).map(({p,i})=>`
      <div class="card" style="padding:14px;">
        <div class="seat" style="background:transparent;border:none;padding:0;margin-bottom:${p.blackjackBet>0?'10px':'0'};">
          <div class="seat-name">${p.name}</div>
          <div class="seat-balance">${p.blackjack}</div>
        </div>
        ${p.blackjackBet>0 ? `
          <div class="seat-bet" style="margin-bottom:8px;">Bet on the table: ${p.blackjackBet}</div>
          <div class="row">
            <button class="btn-gold" data-bj-resolve="win|${i}">Win</button>
            <button class="btn-red" data-bj-resolve="lose|${i}">Lose</button>
          </div>
        ` : `<p class="hint" style="text-align:left;margin:0;">Waiting for a bet</p>`}
      </div>
    `).join('');
    body = `<p class="hint">You're the dealer — you don't have your own blackjack balance here.</p>${rows}`;
  } else {
    // Player view: place a bet, then wait for the dealer
    const me = t.players[state.mySeat];
    const others = seatedPlayers.filter(({i})=> i !== state.mySeat && i !== t.dealerSeat).map(({p})=>`
      <div class="seat">
        <span class="seat-name">${p.name}</span>
        <span class="seat-balance">${p.blackjack}${p.blackjackBet>0?` <span class="muted" style="font-size:0.7rem;">(in for ${p.blackjackBet})</span>`:''}</span>
      </div>
    `).join('');

    body = `
      <div class="card">
        <div class="seat me" style="margin-bottom:${me.blackjackBet>0?'10px':'0'};">
          <span class="seat-name">${me.name} <span class="tag">YOU</span></span>
          <span class="seat-balance">${me.blackjack}</span>
        </div>
        ${me.blackjackBet>0
          ? `<p class="hint" style="text-align:left;margin:0;">Bet placed: ${me.blackjackBet} — waiting on the dealer.</p>`
          : `<div class="row">
               <input type="number" id="bjBetAmt${state.mySeat}" placeholder="Bet amount" min="1" />
               <button class="btn-gold" data-bj-bet="${state.mySeat}" style="flex:0 0 auto;">Bet</button>
             </div>`
        }
      </div>
      ${others ? `<div class="card">${others}</div>` : ''}
    `;
  }

  return dealerCard + body;
}

// Small hand-rolled SVG line chart — no external chart library needed.
function renderBalanceChart(t){
  const history = t.balanceHistory || [];
  const seated = t.players.map((p,i)=> (p && !p.empty) ? i : null).filter(i=>i!==null);
  if(history.length < 2 || seated.length === 0){
    return `<div class="card center muted">The balance graph fills in once a few hands are played.</div>`;
  }

  const W = 300, H = 150, PAD = 10;
  let minB = t.startingPoker, maxB = t.startingPoker;
  seated.forEach(i=>{
    history.forEach(h=>{
      const v = h.balances[i];
      if(typeof v === 'number'){ if(v<minB) minB=v; if(v>maxB) maxB=v; }
    });
  });
  if(minB === maxB){ minB -= 10; maxB += 10; }

  const xStep = (W - PAD*2) / Math.max(1, history.length - 1);
  const yFor = v => H - PAD - ((v - minB) / (maxB - minB)) * (H - PAD*2);
  const palette = ['#f0d68a','#b83247','#6fb3b8','#7d9bd1','#e0935a','#a487c9','#e08fb0','#8fc98a'];
  const baselineY = yFor(t.startingPoker);

  const lines = seated.map((seatIdx, colorIdx) => {
    let pts = [];
    history.forEach((h, hi) => {
      const v = h.balances[seatIdx];
      if(typeof v === 'number') pts.push([PAD + hi*xStep, yFor(v)]);
    });
    if(pts.length < 2) return '';
    const d = pts.map((p,i)=> (i===0?'M':'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
    return `<path d="${d}" fill="none" stroke="${palette[colorIdx % palette.length]}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  }).join('');

  const legend = seated.map((seatIdx, colorIdx) => `
    <span style="display:inline-flex;align-items:center;gap:5px;margin-right:12px;margin-bottom:6px;font-size:0.72rem;color:var(--cream-dim);">
      <span style="width:9px;height:9px;border-radius:50%;background:${palette[colorIdx % palette.length]};display:inline-block;"></span>
      ${t.players[seatIdx].name}
    </span>
  `).join('');

  return `
    <div class="card">
      <h2 style="margin-top:0;font-size:1rem;color:var(--gold-bright);">Poker balance over time</h2>
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">
        <line x1="${PAD}" y1="${baselineY.toFixed(1)}" x2="${W-PAD}" y2="${baselineY.toFixed(1)}" stroke="rgba(243,233,210,0.25)" stroke-width="1" stroke-dasharray="4,3"/>
        ${lines}
      </svg>
      <div style="margin-top:8px;">${legend}</div>
      <p class="hint">Dashed line = starting stack (${t.startingPoker})</p>
    </div>
  `;
}

function renderLoans(t){
  const seatedPlayers = t.players.map((p,i)=> (p && !p.empty) ? {p,i} : null).filter(Boolean);
  const others = seatedPlayers.filter(({i})=> i !== state.mySeat);
  const me = state.mySeat !== null ? t.players[state.mySeat] : null;

  const chart = renderBalanceChart(t);

  const giveCard = me ? `
    <div class="card">
      <h2 style="margin-top:0;font-size:1rem;color:var(--gold-bright);">Give a loan</h2>
      <p class="muted">Loans come out of your own poker coins, carry ${Math.round(LOAN_INTEREST_RATE*100)}% interest, and ${Math.round(LOAN_REPAYMENT_SHARE*100)}% of every pot they win gets skimmed back to you until it's paid off.</p>
      ${others.length ? `
        <label>Loan to</label>
        <select id="loanTarget">${others.map(({p,i})=>`<option value="${i}">${p.name}</option>`).join('')}</select>
        <label>Amount (your coins: ${me.poker})</label>
        <div class="row">
          <input type="number" id="loanAmt" placeholder="Amount" min="1" />
          <button class="btn-gold" id="giveLoanBtn" style="flex:0 0 auto;">Loan</button>
        </div>
      ` : `<p class="muted">No one else is seated yet.</p>`}
    </div>
  ` : '';

  const loans = (t.loans || []).slice().sort((a,b)=> b.timestamp - a.timestamp);
  const loanRows = loans.length ? loans.map(l=>{
    const lenderName = t.players[l.lender] ? t.players[l.lender].name : '(left)';
    const borrowerName = t.players[l.borrower] ? t.players[l.borrower].name : '(left)';
    const status = !l.active ? (l.repaid >= l.totalOwed ? 'Paid off' : 'Closed') : `Owes ${l.totalOwed - l.repaid}`;
    return `
      <div class="seat">
        <div>
          <div class="seat-name">${lenderName} → ${borrowerName}</div>
          <div class="seat-bet">borrowed ${l.principal}, owed ${l.totalOwed}, repaid ${l.repaid}</div>
        </div>
        <div class="seat-balance" style="font-size:0.85rem;">${status}</div>
      </div>
    `;
  }).join('') : `<p class="muted center">No loans yet.</p>`;

  return `
    ${chart}
    ${giveCard}
    <div class="card">
      <h2 style="margin-top:0;font-size:1rem;color:var(--gold-bright);">Loan log</h2>
      ${loanRows}
    </div>
  `;
}

// ---------- EVENT WIRING ----------

function attachHandlers(){
  const $ = sel => document.querySelector(sel);
  const $$ = sel => document.querySelectorAll(sel);

  if(state.screen === 'home'){
    $('#createBtn')?.addEventListener('click', ()=>{
      const hostName = $('#hostName').value;
      if(!hostName.trim()){ toast('Enter your name first'); return; }
      const seats = parseInt($('#seatCount').value,10);
      const sp = parseInt($('#startPoker').value,10) || 1000;
      const sb = parseInt($('#startBj').value,10) || 500;
      createTable(seats, sp, sb, hostName).then(()=>{
        state.screen = 'table';
        startPolling();
        render();
      });
    });
    $('#goJoinBtn')?.addEventListener('click', ()=>{ state.screen='join'; render(); });
    $('#cleanupRoomsBtn')?.addEventListener('click', cleanupOldRooms);
  }

  if(state.screen === 'join'){
    $('#joinBtn')?.addEventListener('click', ()=> joinByCode($('#joinCode').value));
    $('#joinCode')?.addEventListener('keydown', e=>{ if(e.key==='Enter') joinByCode($('#joinCode').value); });
    $('#backBtn')?.addEventListener('click', goHome);
  }

  if(state.screen === 'table'){
    $('#leaveBtn')?.addEventListener('click', goHome);
    $$('.tab-btn').forEach(b=> b.addEventListener('click', ()=>{ state.tab = b.dataset.tab; render(); }));

    $('#myNameInput')?.addEventListener('input', e=>{ state.myName = e.target.value; });
    document.querySelectorAll('[data-claim]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const idx = parseInt(el.dataset.claim,10);
        const name = $('#myNameInput').value;
        claimSeat(idx, name);
      });
    });

    $('#pokerBetBtn')?.addEventListener('click', ()=>{
      placePokerBet(state.mySeat, $('#pokerBetAmt').value);
    });
    $$('[data-preset-bet]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const input = $('#pokerBetAmt');
        const current = parseInt(input.value, 10) || 0;
        input.value = current + parseInt(el.dataset.presetBet, 10);
        input.focus();
      });
    });
    $('#callBtn')?.addEventListener('click', ()=>{
      callPokerBet(state.mySeat);
    });
    $('#awardBtn')?.addEventListener('click', ()=>{
      awardPot(parseInt($('#winnerSelect').value,10));
    });
    $('#returnBetsBtn')?.addEventListener('click', returnPokerBets);
    $('#resetPokerBtn')?.addEventListener('click', resetPokerBalances);
    $('#resetBjBtn')?.addEventListener('click', resetBlackjackBalances);

    $('#giveLoanBtn')?.addEventListener('click', ()=>{
      const target = $('#loanTarget');
      if(!target) return;
      giveLoan(parseInt(target.value,10), $('#loanAmt').value);
    });
    $$('[data-kick]').forEach(el=>{
      el.addEventListener('click', ()=>{
        kickPlayer(parseInt(el.dataset.kick,10));
      });
    });

    $$('[data-bj-bet]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const idx = parseInt(el.dataset.bjBet,10);
        placeBjBet(idx, $('#bjBetAmt'+idx).value);
      });
    });
    $$('[data-bj-resolve]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const [outcome, idxStr] = el.dataset.bjResolve.split('|');
        resolveBj(parseInt(idxStr,10), outcome);
      });
    });

    $('#setDealerBtn')?.addEventListener('click', ()=>{
      setDealer(parseInt($('#dealerSelect').value,10));
    });
    $('#changeDealerBtn')?.addEventListener('click', async ()=>{
      if(!isHost()){ toast('Only the host can do that'); return; }
      const tx = await transactTable(t=>{
        t.dealerSeat = null;
      });
      if(tx.error){ toast(tx.error); return; }
      if(!tx.committed) return;
      render();
    });
  }
}

render();
</script>
</body>
</html>
